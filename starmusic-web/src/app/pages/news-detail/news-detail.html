<div class="container page">
  @if (article(); as a) {
    <article class="article">
      <div class="article-head">
        <span class="cat">{{ a.category }}</span>
        @if (a.breaking) {
          <span class="breaking">快訊</span>
        }
      </div>
      <h1>{{ a.title }}</h1>
      <div class="byline">
        <span>{{ a.source }} · {{ a.author }}</span>
        <time>{{ a.publishedAt | date: 'yyyy年MM月dd日 HH:mm' }}</time>
      </div>
      <div class="hero-img">{{ a.category }}</div>
      <p class="lead">{{ a.summary }}</p>
      <p class="content">{{ a.content }}</p>
      <a class="btn ghost back" routerLink="/news">← 返回新聞列表</a>
    </article>
  } @else {
    <p class="empty">載入中…</p>
  }
</div>
