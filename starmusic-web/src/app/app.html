<header class="site-header">
  <div class="container header-inner">
    <a class="logo" routerLink="/">
      <span class="star">★</span> 星光全球娛樂台
      <small>Star Music Global</small>
    </a>
    <nav class="main-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">首頁</a>
      <a routerLink="/videos" routerLinkActive="active">影視</a>
      <a routerLink="/radio" routerLinkActive="active">電台</a>
      <a routerLink="/news" routerLinkActive="active">新聞</a>
      <a routerLink="/magazines" routerLinkActive="active">雜誌</a>
      <a routerLink="/shop" routerLinkActive="active">購物</a>
    </nav>
    <form class="search-box" (ngSubmit)="search()">
      <input type="search" name="keyword" [(ngModel)]="keyword"
             placeholder="搜尋影片、新聞、雜誌、商品…" />
      <button type="submit" aria-label="搜尋">🔍</button>
    </form>
    <div class="header-actions">
      <a class="cart-link" routerLink="/cart">
        🛒
        @if (cartService.cart().items.length > 0) {
          <span class="cart-count">{{ cartService.cart().items.length }}</span>
        }
      </a>
      <a class="member-link" routerLink="/member">
        @if (auth.member(); as m) {
          {{ m.nickname }}
        } @else {
          登入 / 註冊
        }
      </a>
    </div>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="container">
    <p>★ 星光全球娛樂台 Star Music Global Entertainment</p>
    <p class="dim">影視 · 電台 · 新聞 · 電子雜誌 · 購物 — 網站雛形 Demo</p>
  </div>
</footer>
