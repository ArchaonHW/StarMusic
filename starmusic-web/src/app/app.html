<header class="site-header">
  <div class="container header-inner">
    <a class="logo" routerLink="/">
      <span class="star">★</span> 星光全球娛樂台
      <small>Star Music Global</small>
    </a>
    <nav class="main-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">首頁</a>
      <a routerLink="/videos" routerLinkActive="active">影視</a>
      <a routerLink="/radio" routerLinkActive="active">電台</a>
      <a routerLink="/news" routerLinkActive="active">新聞</a>
      <a routerLink="/magazines" routerLinkActive="active">雜誌</a>
      <a routerLink="/shop" routerLinkActive="active">購物</a>
      @if (auth.member()?.role === 'ADMIN') {
        <a routerLink="/admin" routerLinkActive="active">後台</a>
      }
    </nav>
    <div class="header-actions">
      <a class="member-link" routerLink="/member">
        @if (auth.member(); as m) {
          {{ m.nickname }}
        } @else {
          登入 / 註冊
        }
      </a>
    </div>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="container">
    <img class="footer-logo" src="/media/star-logo.jpg" alt="星光流行音樂網 Star Music Radio" />
    <p>★ 星光全球娛樂台 Star Music Global Entertainment</p>
    <p class="dim">影視 · 電台 · 新聞 · 電子雜誌 · 購物 — 網站雛形 Demo</p>
    <p class="visitor-counter">
      <img
        src="https://hits.sh/9678no6i.vhw13.pumo.com.tw.svg?label=%E7%B8%BD%E8%A7%80%E7%9C%8B%E6%95%B8&color=e83e8c&labelColor=1a1440&style=flat-square&extraCount=13600313"
        alt="總觀看數"
      />
    </p>
  </div>
</footer>
