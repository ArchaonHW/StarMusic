server:
  port: 8080

spring:
  application:
    name: star-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - AddResponseHeader=X-Content-Type-Options, nosniff
            - AddResponseHeader=X-Frame-Options, DENY
            - AddResponseHeader=Referrer-Policy, strict-origin-when-cross-origin
          globalcors:
            cors-configurations:
              '[/**]':
                # 允許的前端來源，逗號分隔；可用環境變數覆寫
                allowed-origins: "${STARMUSIC_ALLOWED_ORIGINS:http://localhost:4200,http://9678no6i.vhw13.pumo.com.tw}"
                allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
                allowed-headers: "Content-Type,Authorization"
                allow-credentials: false
          routes:
            - id: video-service
              uri: lb://star-video-service
              predicates:
                - Path=/api/videos/**
            - id: radio-service
              uri: lb://star-radio-service
              predicates:
                - Path=/api/radio/**
            - id: news-service
              uri: lb://star-news-service
              predicates:
                - Path=/api/news/**
            - id: magazine-service
              uri: lb://star-magazine-service
              predicates:
                - Path=/api/magazines/**
            - id: shop-service
              uri: lb://star-shop-service
              predicates:
                - Path=/api/products/**,/api/cart/**,/api/orders/**
            - id: member-service
              uri: lb://star-member-service
              predicates:
                - Path=/api/members/**
            - id: search-service
              uri: lb://star-search-service
              predicates:
                - Path=/api/search/**
            - id: post-service
              uri: lb://star-post-service
              predicates:
                - Path=/api/posts/**

starmusic:
  jwt-secret: ${STARMUSIC_JWT_SECRET:starmusic-dev-secret-do-not-use-in-prod-0123456789}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
