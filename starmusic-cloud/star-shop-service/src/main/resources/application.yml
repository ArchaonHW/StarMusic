server:
  port: 8085

spring:
  application:
    name: star-shop-service
  datasource:
    url: jdbc:h2:file:./data/shopdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ${STARMUSIC_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
